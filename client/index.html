<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/flyertech-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="robots" content="index, follow" />

    <!-- Google Search Console Verification Support -->
    <meta name="google-site-verification" content="GSC_VERIFICATION_TOKEN_FLYERTECH" />

    <!-- Default Primary Meta Tags -->
    <title>FlyerTech - Enterprise Technology & Software Architecture Blog</title>
    <meta name="description" content="In-depth engineering perspectives, distributed architecture, AI systems, and cybersecurity insights written by practitioners." />
    <meta name="keywords" content="software engineering, distributed systems, cloud computing, artificial intelligence, cybersecurity, architecture" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlyerTech" />
    <meta property="og:title" content="FlyerTech - Enterprise Technology & Software Architecture Blog" />
    <meta property="og:description" content="In-depth engineering perspectives, distributed architecture, AI systems, and cybersecurity insights written by practitioners." />
    <meta property="og:image" content="/flyertech-logo.svg" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FlyerTech - Enterprise Technology & Software Architecture Blog" />
    <meta name="twitter:description" content="In-depth engineering perspectives, distributed architecture, AI systems, and cybersecurity insights written by practitioners." />
    <meta name="twitter:image" content="/flyertech-logo.svg" />

    <!-- Google Analytics (gtag.js) Support (Optional via VITE_GA_ID) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // Initialized when measurement ID is provided in .env
      const gaId = "%VITE_GA_ID%";
      if (gaId && !gaId.startsWith("%")) {
        const s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaId;
        document.head.appendChild(s);
        gtag('config', gaId);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
